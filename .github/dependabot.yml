version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Skip versions published in the last day.
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
