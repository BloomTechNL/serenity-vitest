name: CI and npm release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Audit the lockfile before installing
        run: npm audit --audit-level low
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      - name: Pack the checked build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && matrix.node == 24
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (name !== "@bloom-group/serenity-vitest" || version !== process.env.RELEASE_VERSION) {
              throw new Error("Package name or version does not match the requested release");
            }
          '
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mv release/*.tgz release/package.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && matrix.node == 24
        with:
          name: npm-package
          path: release/package.tgz
          if-no-files-found: error

  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'BloomTechNL/serenity-vitest'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
    concurrency:
      group: npm-release-main
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
      - run: npm publish ./package.tgz --ignore-scripts --provenance --access public

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the published commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag "v$RELEASE_VERSION"
          git push origin "refs/tags/v$RELEASE_VERSION"
